## Mosquitto Local (Raspberry Pi) — Configuración
## Solo escucha en localhost. Sin autenticación porque solo el backend local lo usa.
## El puerto 1883 NO debe estar expuesto hacia internet.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

## Solo loopback — no acepta conexiones externas
listener 1883 127.0.0.1
allow_anonymous true

## WebSocket solo local (si se usa dashboard local)
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
